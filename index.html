<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好友專屬-蝦皮推廣連結轉換器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff1ee;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(238, 77, 45, 0.08);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        .badge {
            display: inline-block;
            background-color: #fff0ed;
            color: #ee4d2d;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            color: #ee4d2d;
            margin: 0 0 10px 0;
            font-weight: bold;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .label {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 16px;
            border: 1px solid #e8e8e8;
            border-radius: 16px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            background-color: #fbfbfb;
            transition: all 0.3s;
        }
        textarea:focus {
            border-color: #ee4d2d;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(238, 77, 45, 0.1);
        }
        button {
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-submit {
            background-color: #e54a2b;
            color: white;
        }
        .btn-submit:hover {
            background-color: #d13f22;
        }
        .btn-clear {
            background-color: #f0f0f0;
            color: #555;
            margin-bottom: 0;
        }
        .btn-clear:hover {
            background-color: #e5e5e5;
        }
        .result-box {
            margin-top: 25px;
            display: none;
            background: #fffdfd;
            border: 2px dashed #ee4d2d;
            padding: 20px;
            border-radius: 16px;
        }
        .result-title {
            font-size: 15px;
            font-weight: bold;
            color: #ee4d2d;
            margin-bottom: 15px;
        }
        .btn-all-copy {
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            font-size: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }
        .btn-all-copy:hover {
            background-color: #27ae60;
        }
        .link-item {
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .link-num {
            font-size: 12px;
            font-weight: bold;
            color: #ee4d2d;
            margin-bottom: 4px;
        }
        .link-url {
            font-size: 13px;
            color: #444;
            word-break: break-all;
            margin-bottom: 8px;
            background: #f7f7f7;
            padding: 6px 8px;
            border-radius: 6px;
        }
        .copy-btn {
            width: auto;
            display: inline-block;
            background-color: #666;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px;
            margin-bottom: 0;
        }
        .copy-btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">好友專屬 | 省錢攻略</div>
    <h1>蝦皮推廣連結轉換器</h1>
    <div class="subtitle">快速轉換連結套用專屬優惠券!!!</div>
    
    <span class="label">蝦皮連結</span>
    <textarea id="inputUrls" placeholder="一次最多貼上多個蝦皮連結，每行一個"></textarea>
    
    <button class="btn-submit" onclick="convertUrls()">產生推廣連結</button>
    <button class="btn-clear" onclick="clearAll()">清除</button>

    <div id="resultBox" class="result-box">
        <div class="result-title">✨ 轉換成功！</div>
        <button id="allCopyBtn" class="btn-all-copy" onclick="copyAllLinks()">💥 一鍵複製全部連結</button>
        <div id="linksContainer"></div>
    </div>
</div>

<script>
    // 這裡已經把變數完全移除，直接寫死您的代碼
    const MY_CHANNEL_ID = "9fLHDaRIoQ";
    let allGeneratedLinks = [];

    function convertUrls() {
        const inputText = document.getElementById('inputUrls').value.trim();
        const resultBox = document.getElementById('resultBox');
        const container = document.getElementById('linksContainer');
        
        if (!inputText) {
            alert('請先貼上蝦皮商品網址喔！');
            return;
        }

        const lines = inputText.split(/\r?\n/);
        container.innerHTML = ''; 
        allGeneratedLinks = []; 
        let validCount = 0;

        lines.forEach((line) => {
            let url = line.trim();
            if (!url) return; 

            if (url.includes('shopee.tw') || url.includes('shp.ee')) {
                validCount++;
                
                // 網址直接組合，不經過舊變數代換
                let finalLink = "https://shopee.tw" + encodeURIComponent(url);
                allGeneratedLinks.push(finalLink);
                
                let itemDiv = document.createElement('div');
                itemDiv.className = 'link-item';
                itemDiv.innerHTML = `
                    <div class="link-num">🔗 連結 ${validCount}</div>
                    <div class="link-url" id="url_${validCount}">${finalLink}</div>
                    <button class="copy-btn" id="btn_${validCount}" onclick="copySingleLink(${validCount})">複製此連結</button>
                `;
                container.appendChild(itemDiv);
            }
        });

        if (validCount === 0) {
            alert('找不到正確的蝦皮網址，請確認複製了完整的商品連結！');
            resultBox.style.display = 'none';
        } else {
            resultBox.style.display = 'block';
            document.getElementById('allCopyBtn').innerText = "💥 一鍵複製全部連結";
            document.getElementById('allCopyBtn').style.backgroundColor = "#2ecc71";
        }
    }

    function copySingleLink(id) {
        const text = document.getElementById(`url_${id}`).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.getElementById(`btn_${id}`);
            copyBtn.innerText = "✅ 複製成功";
            copyBtn.style.backgroundColor = "#2ecc71";
            setTimeout(() => {
                copyBtn.style.backgroundColor = "#666";
                copyBtn.innerText = "複製此連結";
            }, 2000);
        });
    }

    function copyAllLinks() {
        if (allGeneratedLinks.length === 0) return;
        
        const allText = allGeneratedLinks.join('\n');
        navigator.clipboard.writeText(allText).then(() => {
            const allCopyBtn = document.getElementById('allCopyBtn');
            allCopyBtn.innerText = "✅ 已全部複製！快去貼給好友吧";
            allCopyBtn.style.backgroundColor = "#27ae60";
            setTimeout(() => {
                allCopyBtn.innerText = "💥 一鍵複製全部連結";
                allCopyBtn.style.backgroundColor = "#2ecc71";
            }, 2500);
        }).catch(err => {
            alert('複製失敗，請手動複製下方網址！');
        });
    }

    function clearAll() {
        document.getElementById('inputUrls').value = '';
        document.getElementById('resultBox').style.display = 'none';
        allGeneratedLinks = [];
    }
</script>

</body>
</html>
